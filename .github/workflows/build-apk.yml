name: Build & Release Android APK

on:
  push:
    branches: [ "**" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Ensure .env exists
        run: |
          if [ ! -f ".env" ]; then
            if [ -f ".env.example" ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

      - name: Ensure debug.keystore exists
        run: |
          if [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure gradlew is executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare Named APK File
        run: |
          mkdir -p release-apk
          cp app/build/outputs/apk/debug/*.apk release-apk/BranchOps-Pulse.apk
          ls -la release-apk/

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BranchOps-Pulse-APK
          path: release-apk/BranchOps-Pulse.apk
          if-no-files-found: error

      - name: Publish to GitHub Releases (Automatic Download Link)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name || 'v1.0.0' }}
          name: "BranchOps Pulse APK (${{ github.ref_name || 'v1.0.0' }})"
          body: |
            ### 📱 BranchOps Pulse Android APK
            
            Download and install `BranchOps-Pulse.apk` directly on your Android phone or tablet.
            
            - **Package**: `com.aistudio.branchopspulse.vxqrmk`
            - **WhatsApp Share Handler**: Text, Links, Photos, Documents
            - **21-Point Daily Checklist**: 31-Day Routine Tracker
            - **5:00 PM Alarm**: Automated reminder before 6:00 PM closing
          files: release-apk/BranchOps-Pulse.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
